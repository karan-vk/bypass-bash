name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Upload Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: shell-mcp
            asset_name: shell-mcp-linux-amd64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: shell-mcp
            asset_name: shell-mcp-macos-arm64.tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: shell-mcp
            asset_name: shell-mcp-macos-amd64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: shell-mcp.exe
            asset_name: shell-mcp-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} shell-mcp

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} shell-mcp.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
