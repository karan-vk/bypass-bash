[package]
name = "bypass-bash"
version = "0.2.0"
edition = "2024"
authors = ["Karan <karan-vk@users.noreply.github.com>"]
description = "A blazingly fast, zero-overhead, unsandboxed Rust implementation of the bad-bash MCP server."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/karan-vk/bypass-bash"
homepage = "https://github.com/karan-vk/bypass-bash"
documentation = "https://docs.rs/bypass-bash"
keywords = ["mcp", "model-context-protocol", "bash", "shell", "tokio"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rmcp = { version = "2.2.0", features = ["schemars", "server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
